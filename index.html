<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Stock Analyzer Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- TradingView Ticker Tape Widget -->
    <div class="tradingview-widget-container ticker-tape" style="position: sticky; top: 0; z-index: 100;">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js"
            async>
                {
                    "symbols": [
                        { "proName": "BSE:SENSEX", "title": "Sensex" },
                        { "proName": "NSE:NIFTY", "title": "Nifty 50" },
                        { "proName": "NSE:BANKNIFTY", "title": "Bank Nifty" },
                        { "proName": "NSE:RELIANCE", "title": "Reliance" },
                        { "proName": "NSE:HDFCBANK", "title": "HDFC Bank" },
                        { "proName": "NSE:INFY", "title": "Infosys" },
                        { "proName": "NSE:TCS", "title": "TCS" },
                        { "proName": "NSE:ICICIBANK", "title": "ICICI Bank" }
                    ],
                        "showSymbolLogo": true,
                            "isTransparent": false,
                                "displayMode": "adaptive",
                                    "colorTheme": "dark",
                                        "locale": "in"
                }
            </script>
    </div>

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <header>
            <h1>NSE Intraday Analyzer <span class="badge">PRO</span></h1>
            <p>Real-time data from TradingView & 15-minute timeframe technical analysis for Nifty 50.</p>
        </header>

        <section class="market-screener-section glass-panel" style="margin-bottom: 2rem; padding: 1.5rem;">
            <h2 style="margin-bottom: 1rem; font-size: 1.5rem; color: var(--text-main);">Live Market Watch (All NSE
                Stocks)</h2>
            <!-- TradingView Widget BEGIN -->
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript"
                    src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
                        {
                            "width": "100%",
                                "height": 450,
                                    "defaultColumn": "overview",
                                        "defaultScreen": "general",
                                            "market": "india",
                                                "showToolbar": true,
                                                    "colorTheme": "dark",
                                                        "locale": "in",
                                                            "isTransparent": true
                        }
                    </script>
            </div>
            <!-- TradingView Widget END -->
        </section>


        <section class="controls">
            <button id="analyze-btn" class="primary-btn">
                <span class="btn-text">Run Market Analysis</span>
                <span class="loader hidden"></span>
            </button>
            <div id="status-text" class="status-text">Ready to scan Nifty 50 universe...</div>
        </section>

        <div class="signals-layout">
            <section class="signal-column buy-column">
                <div class="column-header">
                    <h2>Top 5 Buy Signals</h2>
                    <span class="pulse-indicator green"></span>
                </div>
                <div id="buy-results-container" class="results-grid">
                    <!-- Buy cards injected via JS -->
                </div>
            </section>

            <section class="signal-column sell-column">
                <div class="column-header">
                    <h2>Top 5 Sell Signals</h2>
                    <span class="pulse-indicator red"></span>
                </div>
                <div id="sell-results-container" class="results-grid">
                    <!-- Sell cards injected via JS -->
                </div>
            </section>
        </div>
    </main>

    <template id="stock-card-template">
        <div class="stock-card glass-panel">
            <div class="card-header">
                <h2 class="stock-symbol">SYMBOL</h2>
                <div class="stock-score">Score: <span>0</span>/100</div>
            </div>
            <div class="price-section">
                <div class="current-price">₹0.00</div>
            </div>
            <div class="indicators-grid">
                <div class="indicator">
                    <span class="label">RSI (14)</span>
                    <span class="value rsi-value">0.00</span>
                </div>
                <div class="indicator">
                    <span class="label">MACD</span>
                    <span class="value macd-value">0.00</span>
                </div>
                <div class="indicator" style="grid-column: span 2;">
                    <span class="label">Trend (EMA)</span>
                    <span class="value ema-trend">Neutral</span>
                </div>
                <div class="indicator target-highlight">
                    <span class="label">Target</span>
                    <span class="value target-value">₹0.00</span>
                </div>
                <div class="indicator sl-highlight">
                    <span class="label">Stop Loss</span>
                    <span class="value sl-value">₹0.00</span>
                </div>
            </div>
            <div class="card-footer">
                <button class="action-btn">Action</button>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>

</html>
